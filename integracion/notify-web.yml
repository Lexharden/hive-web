# Copia este archivo en .github/workflows/notify-web.yml de cada repo que aparece en la web:
#   Lexharden/HiveShock-Avalonia, Lexharden/HiveBuzz,
#   Lexharden/Shipwright-HiveShock, Lexharden/2ship2harkinian-HiveShock
#
# Necesita el secreto WEB_DISPATCH_TOKEN en cada repo (ver README de hive-web).
#
# Por qué dos disparadores:
#   - `release` cubre los releases que publicas o editas a mano (también publicar un borrador).
#   - Un release creado por otro workflow con GITHUB_TOKEN no dispara `release` (regla de GitHub),
#     así que también se escucha el fin del workflow de release del propio repo.
name: Avisar a la web

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_run:
    workflows: [Release, release]
    types: [completed]

jobs:
  notify:
    if: github.event_name == 'release' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Pedir un nuevo build de hive-web
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
          ACTION: ${{ github.event.action || 'workflow_run' }}
          TAG: ${{ github.event.release.tag_name || github.event.workflow_run.head_branch }}
        run: |
          gh api repos/Lexharden/hive-web/dispatches \
            -f event_type=release-changed \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[action]=$ACTION" \
            -f "client_payload[tag]=$TAG"
